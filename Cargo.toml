[package]
name = "kindle-stripper"
version = "0.100.0"
description = "A Rust port of Satsuoni's DeDRM fork"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
anyhow = "1"
base64 = "0.22"
boko = { version = "0.6", default-features = false }
cbc = "0.1"
hkdf = "0.12"
hmac = "0.12"
lopdf = { version = "0.47", default-features = false }
lzma-rs = "0.3"
md-5 = "0.10"
percent-encoding = "2"
quick-xml = "0.42"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] }
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
